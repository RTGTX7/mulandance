c<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学计算器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression">
                <span id="expr-text"></span>
                <span class="cursor" id="cursor"></span>
            </div>
            <div class="result" id="result">0</div>
            <div class="memory-indicator" id="memory-indicator"></div>
        </div>
        <div class="buttons">
            <!-- 记忆功能行 -->
            <div class="mem-row">
                <button class="btn-mem" data-action="mc">MC</button>
                <button class="btn-mem" data-action="mr">MR</button>
                <button class="btn-mem" data-action="m+">M+</button>
                <button class="btn-mem" data-action="m-">M-</button>
                <button class="btn-mem" data-action="ms">MS</button>
            </div>
            <!-- 科学函数行 1 -->
            <div class="sci-row">
                <button class="btn-sci" data-value="sin(">sin</button>
                <button class="btn-sci" data-value="cos(">cos</button>
                <button class="btn-sci" data-value="tan(">tan</button>
                <button class="btn-sci" data-value="asin(">sin<sup>-1</sup></button>
                <button class="btn-sci" data-value="acos(">cos<sup>-1</sup></button>
            </div>
            <!-- 科学函数行 2 -->
            <div class="sci-row">
                <button class="btn-sci" data-value="atan(">tan<sup>-1</sup></button>
                <button class="btn-sci" data-value="log(">log</button>
                <button class="btn-sci" data-value="ln(">ln</button>
                <button class="btn-sci" data-value="^">x<sup>y</sup></button>
                <button class="btn-sci" data-value="^2">x<sup>2</sup></button>
            </div>
            <!-- 科学函数行 3 -->
            <div class="sci-row">
                <button class="btn-sci" data-value="sqrt(">√x</button>
                <button class="btn-sci" data-value="abs(">|x|</button>
                <button class="btn-sci" data-value="1/">1/x</button>
                <button class="btn-sci" data-value="fact(">n!</button>
                <button class="btn-sci" data-value="pi">&pi;</button>
            </div>
            <!-- 科学函数行 4 -->
            <div class="sci-row">
                <button class="btn-sci" data-value="e">e</button>
            </div>
            <!-- 功能键行 1 -->
            <div class="main-row">
                <button class="btn-fn" data-action="clear">AC</button>
                <button class="btn-fn" data-action="clear-entry">CE</button>
                <button class="btn-fn" data-action="backspace">⌫</button>
                <button class="btn-op" data-value="(">(</button>
                <button class="btn-op" data-value=")">)</button>
            </div>
            <!-- 数字行 1 -->
            <div class="main-row">
                <button class="btn-num" data-value="7">7</button>
                <button class="btn-num" data-value="8">8</button>
                <button class="btn-num" data-value="9">9</button>
                <button class="btn-op" data-value="/">/</button>
                <button class="btn-op" data-value="*">&times;</button>
            </div>
            <!-- 数字行 2 -->
            <div class="main-row">
                <button class="btn-num" data-value="4">4</button>
                <button class="btn-num" data-value="5">5</button>
                <button class="btn-num" data-value="6">6</button>
                <button class="btn-op" data-value="-">-</button>
                <button class="btn-op" data-value="+">+</button>
            </div>
            <!-- 数字行 3 -->
            <div class="main-row">
                <button class="btn-num" data-value="1">1</button>
                <button class="btn-num" data-value="2">2</button>
                <button class="btn-num" data-value="3">3</button>
                <button class="btn-op" data-action="toggle-sign">&plusmn;</button>
                <button class="btn-op btn-equals" data-action="equals">=</button>
            </div>
            <!-- 数字行 4 -->
            <div class="main-row">
                <button class="btn-num" data-value="0" style="grid-column: span 2;">0</button>
                <button class="btn-num" data-value=".">.</button>
                <button class="btn-num" data-value="pi">&pi;</button>
                <button class="btn-num" data-value="e">e</button>
            </div>
        </div>
        <!-- 历史记录面板 -->
        <div class="history-panel">
            <div class="history-header" id="history-toggle">
                <span>&#8962; 历史记录</span>
            </div>
            <div class="history-content" id="history-content">
                <div class="history-actions">
                    <button id="clear-history-btn">清除历史</button>
                </div>
                <div id="history-list"></div>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
