services:
  backend:
    image: rtgtx7/mulanstudio:backend-latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change_me_to_a_long_random_secret}
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT}
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE}
      LOGTO_SESSION_ASSERTION_SECRET: ${LOGTO_SESSION_ASSERTION_SECRET}
      LOGTO_BOOTSTRAP_SUPER_ADMIN_EMAIL: ${LOGTO_BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      LOGTO_BOOTSTRAP_SUPER_ADMIN_SUB: ${LOGTO_BOOTSTRAP_SUPER_ADMIN_SUB:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      DATA_DIR: ${DATA_DIR:-/app/data}
      NEWS_FILES_DIR: ${NEWS_FILES_DIR:-/app/data/news}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/data/uploads}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-http://localhost:3000,http://127.0.0.1:3000}
      USE_FILE_STORAGE: ${USE_FILE_STORAGE:-true}
      AI_MAX_URLS: ${AI_MAX_URLS:-10}
      AI_MAX_IMAGES_PER_URL: ${AI_MAX_IMAGES_PER_URL:-5}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    image: rtgtx7/mulanstudio:frontend-latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_LOGTO_ENDPOINT: ${NEXT_PUBLIC_LOGTO_ENDPOINT:-https://login.mulandance.ca}
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT}
      LOGTO_APP_ID: ${LOGTO_APP_ID}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET}
      LOGTO_COOKIE_SECRET: ${LOGTO_COOKIE_SECRET}
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE}
      LOGTO_SESSION_ASSERTION_SECRET: ${LOGTO_SESSION_ASSERTION_SECRET}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
